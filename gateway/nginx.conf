worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Upstream definitions (uses Docker service names)
    upstream auth_service {
        server auth-service:5001;
    }

    upstream product_service {
        server product-service:5002;
    }

    upstream ai_service {
        server ai-service:5003;
    }

    server {
        listen 5000;

        # ── CORS headers ───────────────────────────────────────
        add_header 'Access-Control-Allow-Origin'  'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, Cache-Control, X-Requested-With' always;

        # Handle preflight OPTIONS globally
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ── Health check ───────────────────────────────────────
        location = / {
            return 200 '{"message":"SmartCart API Gateway Running"}';
            add_header Content-Type application/json;
        }

        # ── Auth Service (/auth/* -> auth-service:5001/auth/*) ─
        # NOTE: No trailing slash on proxy_pass → preserves full path
        location /auth/ {
            proxy_pass         http://auth_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Product Service ────────────────────────────────────
        location /products/ {
            proxy_pass         http://product_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /categories/ {
            proxy_pass         http://product_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /cart/ {
            proxy_pass         http://product_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /wishlist/ {
            proxy_pass         http://product_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /orders/ {
            proxy_pass         http://product_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ── AI Service ─────────────────────────────────────────
        location /ai/ {
            proxy_pass         http://ai_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /chat/ {
            proxy_pass         http://ai_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ── WebSocket / Socket.io ──────────────────────────────
        location /socket.io/ {
            proxy_pass         http://ai_service;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
        }
    }
}
