services:

  mongodb:
    image: mongo:7
    container_name: smartcart-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smartcart-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongodb:27017/smartcart
      - PORT=5001
      - NODE_ENV=production
    env_file:
      - ./auth-service/.env
    restart: unless-stopped
    networks:
      - smartcart-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "5002:5002"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongodb:27017/smartcart
      - PORT=5002
      - NODE_ENV=production
    env_file:
      - ./product-service/.env
    restart: unless-stopped
    networks:
      - smartcart-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    ports:
      - "5003:5003"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongodb:27017/smartcart
      - PORT=5003
      - NODE_ENV=production
    env_file:
      - ./ai-service/.env
    restart: unless-stopped
    networks:
      - smartcart-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - product-service
      - ai-service
    restart: unless-stopped
    networks:
      - smartcart-network

volumes:
  mongodb_data:

networks:
  smartcart-network:
    driver: bridge
